name: Generate Maze Books
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fpdf2
          # If you have other dependencies, keep the line below:
          # pip install -r requirements.txt

      - name: Generate Mazes
        run: python main.py

      - name: Upload Maze PDF
        uses: actions/upload-artifact@v4
        with:
          name: maze-books
          # Based on your script, the file is saved in the root directory.
          # If you want it in an 'output' folder, create that folder in Python first.
          path: "*.pdf"
